version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: firezombie_db
    environment:
      POSTGRES_USER: firezombie
      POSTGRES_PASSWORD: firezombie_pwd
      POSTGRES_DB: firezombie_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firezombie"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: firezombie_backend
    environment:
      DATABASE_URL: postgresql://firezombie:firezombie_pwd@postgres:5432/firezombie_db
      # Values come from a .env file next to this file (copy .env.example to .env)
      JWT_SECRET: ${JWT_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app

volumes:
  postgres_data:
